<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog // 生物酶实验室</title>
    <script>
    (function(){var t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}document.documentElement.className=t;})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header>
        <button class="menu" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
        <div class="header-left-group">
            <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                <svg class="header-logo-icon" viewBox="0 0 48 48" width="36" height="36">
                    <polygon points="24,4 41.3,14 41.3,34 24,44 6.7,34 6.7,14" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                    <polygon points="24,12 36,24 24,36 12,24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.85"/>
                    <polygon points="24,17 31,24 24,31 17,24" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
                    <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="0.7" opacity="0.35"/>
                    <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="0.7" opacity="0.35"/>
                    <line x1="12" y1="24" x2="6.7" y2="24" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
                    <line x1="36" y1="24" x2="41.3" y2="24" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
                    <circle cx="24" cy="4" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="41.3" cy="14" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="41.3" cy="34" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="24" cy="44" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="6.7" cy="34" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="6.7" cy="14" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="24" cy="12" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="36" cy="24" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="24" cy="36" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="12" cy="24" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="24" cy="24" r="2" fill="currentColor" opacity="0.75"/>
                </svg>
                <div class="header-title-block">
                    <span class="header-title-zh">生物酶实验室</span>
                    <span class="header-title-en">ENZYME LABORATORY</span>
                </div>
            </a>
            <span class="header-vdivider"></span>
            <span class="info-line-sub" style="white-space:nowrap;">// BLOG</span>
        </div>
        <ul id="main-nav">
            <li><a href="index.html">[HOME]</a></li>
            <li><a href="https://space.bilibili.com/179241918" target="_blank">[BILIBILI]</a></li>
            <li><button id="theme-toggle">[LIGHT]</button></li>
        </ul>
    </header>

    <!-- ========== CONTENT ========== -->
    <main class="blog-main">
        <h2 id="blog-heading">博客</h2>
        <div id="blog-posts"></div>
    </main>

    <script src="js/main.js"></script>

    <!-- Blog loader -->
    <script>
    (function() {
        var container = document.getElementById('blog-posts');
        var heading = document.getElementById('blog-heading');
        var allPosts = [];

        fetch('posts.json')
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(posts) {
                if (!posts || posts.length === 0) { showEmpty(); return; }
                allPosts = posts.sort(function(a, b) { return b.date.localeCompare(a.date); });
                renderCurrent();
            })
            .catch(function() { showEmpty(); });

        // Re-render on hash change (user clicks a blog card)
        window.addEventListener('hashchange', renderCurrent);

        function renderCurrent() {
            var hash = window.location.hash.replace('#', '');
            try { hash = decodeURIComponent(hash); } catch(e) {}
            if (hash) {
                var post = null;
                for (var i = 0; i < allPosts.length; i++) { if (allPosts[i].id === hash) { post = allPosts[i]; break; } }
                if (post) { renderSingle(post, allPosts); return; }
            }
            renderList(allPosts);
        }

        function showEmpty() {
            container.innerHTML = '<div class="blog-empty"><span class="blog-empty-icon">// 0x00</span><p>暂无文章 // NO_POSTS</p></div>';
        }

        function renderList(posts) {
            heading.textContent = '博客';
            var html = '';
            posts.forEach(function(post) {
                html += '<article class="blog-card" data-post-id="' + escAttr(post.id) + '" style="cursor:pointer;">' +
                    '<div class="blog-card-link">' +
                        '<h3 class="blog-card-title">' + esc(post.title) + '</h3>' +
                        '<div class="blog-card-meta">' +
                            '<span class="blog-date">' + esc(post.date) + '</span>' +
                            renderTags(post.tags) +
                        '</div>' +
                        '<p class="blog-summary">' + esc(post.summary || '') + '</p>' +
                        '<span class="blog-expand-hint">[ 阅读 ]</span>' +
                    '</div>' +
                '</article>';
            });
            html += '<div class="blog-footer"><a href="index.html" class="back-link">[ HOME ]</a><span style="color:var(--dim);font-size:0.5rem;margin-left:12px;">' + posts.length + ' post(s)</span></div>';
            container.innerHTML = html;

            // Click handler on entire card — more reliable than <a> tags
            container.querySelectorAll('.blog-card').forEach(function(card) {
                card.addEventListener('click', function() {
                    var id = card.getAttribute('data-post-id');
                    if (id) window.location.hash = id;
                });
            });
        }

        function renderSingle(post, allPosts) {
            heading.innerHTML = '<a href="blog.html" style="color:var(--accent);font-size:0.7rem;">&larr; 返回博客</a>';
            var html = '<article class="blog-post-full">' +
                '<h2 class="blog-post-title">' + esc(post.title) + '</h2>' +
                '<div class="blog-card-meta" style="margin-bottom:1.5rem;">' +
                    '<span class="blog-date">' + esc(post.date) + '</span>' +
                    renderTags(post.tags) +
                '</div>' +
                '<div class="blog-content">' + (post.content || '') + '</div>' +
            '</article>';

            // Other posts
            var others = allPosts.filter(function(p) { return p.id !== post.id; });
            if (others.length > 0) {
                html += '<div class="blog-footer" style="margin-top:3rem;">' +
                    '<span style="font-size:0.6rem;color:var(--dim);">其他文章:</span>';
                others.forEach(function(p) {
                    html += '<span class="blog-other-link" data-post-id="' + escAttr(p.id) + '" style="cursor:pointer;">' + esc(p.title) + '</span>';
                });
                html += '</div>';
            }

            container.innerHTML = html;
            document.title = post.title + ' // 生物酶实验室';

            // Wire up other-post links
            container.querySelectorAll('.blog-other-link').forEach(function(el) {
                el.addEventListener('click', function() {
                    var id = el.getAttribute('data-post-id');
                    if (id) window.location.hash = id;
                });
            });
        }

        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            return '<span class="blog-tags">' + tags.map(function(t) { return '<span class="blog-tag">' + esc(t) + '</span>'; }).join('') + '</span>';
        }

        function esc(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function escAttr(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
    })();
    </script>

    <!-- Theme toggle -->
    <script>
    (function() {
        var html = document.documentElement, toggleBtn = document.getElementById('theme-toggle'), transTimer = null;
        function setTheme(mode) {
            document.body.classList.add('theme-transitioning');
            clearTimeout(transTimer);
            transTimer = setTimeout(function() { document.body.classList.remove('theme-transitioning'); }, 200);
            if (mode === 'light') { html.classList.add('light'); html.classList.remove('dark'); if (toggleBtn) toggleBtn.textContent = '[DARK]'; try { localStorage.setItem('theme', 'light'); } catch(e) {} }
            else { html.classList.remove('light'); html.classList.add('dark'); if (toggleBtn) toggleBtn.textContent = '[LIGHT]'; try { localStorage.setItem('theme', 'dark'); } catch(e) {} }
        }
        if (toggleBtn) { toggleBtn.addEventListener('click', function() { setTheme(html.classList.contains('light')?'dark':'light'); }); }
        var cur = html.classList.contains('light') ? 'light' : 'dark';
        if (toggleBtn) toggleBtn.textContent = cur === 'light' ? '[DARK]' : '[LIGHT]';
    })();
    </script>
</body>
</html>
