<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin // 生物酶实验室</title>
    <script>
    (function(){var t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}document.documentElement.className=t;})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header>
        <button class="menu" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
        <div class="header-left-group">
            <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                <svg class="header-logo-icon" viewBox="0 0 48 48" width="36" height="36">
                    <polygon points="24,4 41.3,14 41.3,34 24,44 6.7,34 6.7,14" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
                    <polygon points="24,12 36,24 24,36 12,24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.85"/>
                    <polygon points="24,17 31,24 24,31 17,24" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
                    <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="0.7" opacity="0.35"/>
                    <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="0.7" opacity="0.35"/>
                    <line x1="12" y1="24" x2="6.7" y2="24" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
                    <line x1="36" y1="24" x2="41.3" y2="24" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
                    <circle cx="24" cy="4" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="41.3" cy="14" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="41.3" cy="34" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="24" cy="44" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="6.7" cy="34" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="6.7" cy="14" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="24" cy="12" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="36" cy="24" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="24" cy="36" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="12" cy="24" r="1.8" fill="currentColor" opacity="0.65"/>
                    <circle cx="24" cy="24" r="2" fill="currentColor" opacity="0.75"/>
                </svg>
                <div class="header-title-block">
                    <span class="header-title-zh">生物酶实验室</span>
                    <span class="header-title-en">ENZYME LABORATORY</span>
                </div>
            </a>
            <span class="header-vdivider"></span>
            <span class="info-line-sub" style="white-space:nowrap;">// ADMIN</span>
        </div>
        <ul id="main-nav">
            <li><a href="index.html">[HOME]</a></li>
            <li><a href="blog.html">[BLOG]</a></li>
            <li><button id="theme-toggle">[LIGHT]</button></li>
        </ul>
    </header>

    <!-- ========== PASSWORD GATE ========== -->
    <div id="password-gate" class="password-gate">
        <h2>管理员验证</h2>
        <p style="color:var(--dim);font-size:0.7rem;">请输入密码以访问博客管理</p>
        <input type="password" id="pw-input" placeholder="Password..." autofocus>
        <p class="password-error" id="pw-error" style="display:none">// ERROR: 密码错误</p>
    </div>

    <!-- ========== TOKEN SETUP ========== -->
    <div id="token-setup" style="display:none" class="password-gate">
        <h2>GitHub Token 配置</h2>
        <p style="color:var(--dim);font-size:0.65rem;max-width:420px;text-align:center;line-height:1.6;">
            前往 GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)<br>
            创建新 Token，勾选 <b>repo</b> 权限，将生成的 Token 粘贴到下方
        </p>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx..." style="width:360px;max-width:90vw;">
        <div style="display:flex;gap:8px;">
            <button id="token-save" class="serial-btn">[ SAVE TOKEN ]</button>
            <button id="token-clear" class="serial-btn" style="display:none;">[ CLEAR TOKEN ]</button>
        </div>
        <p class="password-error" id="token-msg" style="display:none"></p>
    </div>

    <!-- ========== EDITOR ========== -->
    <div id="editor" style="display:none" class="admin-layout">
        <aside class="admin-sidebar">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <span style="font-size:0.6rem;color:var(--dim);">POSTS</span>
                <div>
                    <button id="btn-reload" class="serial-btn serial-btn-sm" style="margin-right:4px;">[ RELOAD ]</button>
                    <button id="btn-new" class="serial-btn serial-btn-sm">[ NEW ]</button>
                </div>
            </div>
            <div id="post-list"></div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                <span style="font-size:0.55rem;color:var(--dim);">DRAFTS</span>
                <div id="draft-list" style="margin-top:4px;"></div>
            </div>
            <button id="btn-reset-token" class="serial-btn serial-btn-sm" style="margin-top:12px;width:100%;opacity:0.4;">[ RESET TOKEN ]</button>
        </aside>

        <div class="admin-main">
            <div class="admin-form">
                <input type="text" id="edit-title" class="admin-field" placeholder="标题...">
                <div style="display:flex;gap:8px;">
                    <input type="date" id="edit-date" class="admin-field" style="flex:1;">
                    <input type="text" id="edit-tags" class="admin-field" style="flex:2;" placeholder="标签 (逗号分隔)">
                </div>
                <input type="text" id="edit-summary" class="admin-field" placeholder="摘要...">
                <!-- Quill editor -->
                <div id="quill-editor" style="flex:1;min-height:300px;"></div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <button id="btn-draft" class="serial-btn">[ SAVE DRAFT ]</button>
                    <button id="btn-publish" class="serial-btn serial-btn-active">[ PUBLISH ]</button>
                    <button id="btn-cancel" class="serial-btn">[ CANCEL ]</button>
                    <span id="publish-status" style="font-size:0.55rem;color:var(--dim);"></span>
                </div>
                <input type="hidden" id="edit-id" value="">
            </div>

            <div class="admin-preview">
                <div style="font-size:0.55rem;color:var(--dim);margin-bottom:8px;">// PREVIEW</div>
                <div id="preview-content" class="blog-content"></div>
            </div>
        </div>
    </div>

    <!-- ========== CONFIRM OVERLAY ========== -->
    <div id="confirm-overlay" class="confirm-overlay" style="display:none;">
        <div class="confirm-box">
            <p style="font-size:0.8rem;margin-bottom:16px;">// CONFIRM</p>
            <p id="confirm-title" style="font-size:0.7rem;margin-bottom:20px;color:var(--text);"></p>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button id="confirm-cancel" class="serial-btn serial-btn-sm">[ CANCEL ]</button>
                <button id="confirm-ok" class="serial-btn serial-btn-sm serial-btn-active">[ DELETE ]</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <script>
    (function() {
        // ================================================================
        // Password gate
        // ================================================================
        var PW_HASH = '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92';
        var pwGate   = document.getElementById('password-gate');
        var pwInput  = document.getElementById('pw-input');
        var pwError  = document.getElementById('pw-error');
        var tokenSetup = document.getElementById('token-setup');
        var editor   = document.getElementById('editor');

        if (sessionStorage.getItem('blog-auth') === '1') {
            pwGate.style.display = 'none';
            checkToken();
        }

        pwInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });

        async function verifyPassword() {
            var input = pwInput.value.trim();
            if (!input) return;
            var hash = await sha256(input);
            if (hash === PW_HASH) {
                sessionStorage.setItem('blog-auth', '1');
                pwGate.style.display = 'none';
                pwError.style.display = 'none';
                checkToken();
            } else {
                pwError.style.display = 'block';
                pwInput.value = '';
                pwInput.focus();
            }
        }

        async function sha256(message) {
            var msgBuffer = new TextEncoder().encode(message);
            var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            var hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

        // ================================================================
        // Token management
        // ================================================================
        var GITHUB_TOKEN = '';
        var REPO_OWNER = 'XhoIeph';
        var REPO_NAME  = 'xhoi_laboratory';
        var POSTS_PATH = 'posts.json';
        var clearTokenBtn = document.getElementById('token-clear');

        function checkToken() {
            var saved = localStorage.getItem('blog-ghtoken');
            if (saved) {
                GITHUB_TOKEN = saved;
                tokenSetup.style.display = 'none';
                if (clearTokenBtn) clearTokenBtn.style.display = '';
                initEditor();
            } else {
                tokenSetup.style.display = '';
                if (clearTokenBtn) clearTokenBtn.style.display = 'none';
                pwGate.style.display = 'none';
            }
        }

        document.getElementById('token-save').addEventListener('click', function() {
            var token = document.getElementById('token-input').value.trim();
            var msgEl = document.getElementById('token-msg');
            if (!token) { msgEl.style.display = 'block'; msgEl.textContent = '// ERROR: Token 不能为空'; return; }
            GITHUB_TOKEN = token;
            localStorage.setItem('blog-ghtoken', token);
            tokenSetup.style.display = 'none';
            msgEl.style.display = 'none';
            initEditor();
        });

        document.getElementById('btn-reset-token').addEventListener('click', function() {
            localStorage.removeItem('blog-ghtoken');
            GITHUB_TOKEN = ''; postsSha = null;
            tokenSetup.style.display = ''; editor.style.display = 'none';
            document.getElementById('token-input').value = '';
            document.getElementById('token-msg').style.display = 'none';
        });

        clearTokenBtn.addEventListener('click', function() {
            localStorage.removeItem('blog-ghtoken');
            GITHUB_TOKEN = ''; postsSha = null;
            tokenSetup.style.display = ''; editor.style.display = 'none';
            document.getElementById('token-input').value = '';
            document.getElementById('token-msg').style.display = 'none';
        });

        // ================================================================
        // Quill editor
        // ================================================================
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            placeholder: '开始撰写...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Image upload: paste or toolbar → upload to GitHub repo
        quill.getModule('toolbar').addHandler('image', function() {
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();
            input.onchange = function() {
                var file = input.files[0];
                if (!file) return;
                uploadImage(file);
            };
        });

        // Also handle paste of images
        quill.root.addEventListener('paste', function(e) {
            var items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (var i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    e.preventDefault();
                    uploadImage(items[i].getAsFile());
                    return;
                }
            }
        });

        async function uploadImage(file) {
            setStatus('正在上传图片...');
            try {
                var ext = file.name.split('.').pop() || 'png';
                var fname = 'blog-' + Date.now() + '.' + ext;
                var path = 'image/blog/' + fname;

                // Read as base64
                var reader = new FileReader();
                var base64 = await new Promise(function(resolve) {
                    reader.onload = function() { resolve(reader.result.split(',')[1]); };
                    reader.readAsDataURL(file);
                });

                // Upload to GitHub
                var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + path;
                var resp = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GITHUB_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '上传博客图片: ' + fname,
                        content: base64
                    })
                });

                if (!resp.ok) {
                    var errData = await resp.json();
                    throw new Error(errData.message || 'HTTP ' + resp.status);
                }

                // Insert into editor
                var range = quill.getSelection(true);
                var imgUrl = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/main/' + path;
                quill.insertEmbed(range.index, 'image', imgUrl);
                quill.setSelection(range.index + 1);
                setStatus('图片已上传');
            } catch(e) {
                setStatus('图片上传失败: ' + e.message);
            }
        }

        // ================================================================
        // Editor state
        // ================================================================
        var posts = [];
        var currentId = null;
        var postsSha = null;

        var postListEl   = document.getElementById('post-list');
        var draftListEl  = document.getElementById('draft-list');
        var editId       = document.getElementById('edit-id');
        var editTitle    = document.getElementById('edit-title');
        var editDate     = document.getElementById('edit-date');
        var editTags     = document.getElementById('edit-tags');
        var editSummary  = document.getElementById('edit-summary');
        var previewEl    = document.getElementById('preview-content');
        var statusEl     = document.getElementById('publish-status');

        async function initEditor() {
            editor.style.display = '';
            editDate.value = todayStr();
            await loadPosts();
            loadDrafts();
        }

        async function loadPosts() {
            var loaded = false;
            if (GITHUB_TOKEN) {
                try {
                    var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + POSTS_PATH;
                    var resp = await fetch(url, { headers: { 'Authorization': 'token ' + GITHUB_TOKEN } });
                    if (resp.ok) {
                        var data = await resp.json();
                        postsSha = data.sha;
                        posts = JSON.parse(decodeUTF8(data.content));
                        loaded = true;
                        setStatus('已从 GitHub 加载 ' + posts.length + ' 篇文章');
                    } else { setStatus('GitHub API 返回 ' + resp.status + '，尝试本地加载...'); }
                } catch(e) { setStatus('GitHub API 连接失败，尝试本地加载...'); }
            } else { setStatus('未配置 Token，从本地加载...'); }

            if (!loaded) {
                try {
                    var localResp = await fetch(POSTS_PATH);
                    if (localResp.ok) { posts = await localResp.json(); loaded = true; setStatus('已从本地加载 ' + posts.length + ' 篇文章'); }
                } catch(e) {}
            }
            if (!loaded) { posts = []; setStatus('无法加载文章。请配置 GitHub Token 或通过本地服务器打开此页面。'); }
            renderPostList();
        }

        function renderPostList() {
            var html = '';
            posts.forEach(function(p, i) {
                html += '<div class="admin-post-item" data-idx="' + i + '">' +
                    '<span style="font-weight:700;">' + esc(p.title) + '</span>' +
                    '<span style="color:var(--dim);font-size:0.55rem;display:block;">' + esc(p.date) + '</span>' +
                '</div>';
            });
            postListEl.innerHTML = html || '<span style="color:var(--dim);font-size:0.55rem;">(empty)</span>';
            postListEl.querySelectorAll('.admin-post-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var idx = parseInt(el.getAttribute('data-idx'));
                    editPost(posts[idx]);
                    postListEl.querySelectorAll('.admin-post-item').forEach(function(e) { e.classList.remove('active'); });
                    el.classList.add('active');
                });
            });
        }

        function loadDrafts() {
            var drafts = [];
            try { drafts = JSON.parse(localStorage.getItem('blog-drafts') || '[]'); } catch(e) {}
            if (drafts.length === 0) { draftListEl.innerHTML = '<span style="color:var(--dim);font-size:0.5rem;">(no drafts)</span>'; return; }
            var html = '';
            drafts.forEach(function(d, i) {
                html += '<div class="admin-post-item admin-draft-item" data-draft="' + i + '">' +
                    '<span style="font-weight:700;">[DRAFT] ' + esc(d.title || 'Untitled') + '</span>' +
                    '<button class="admin-draft-del" data-draft="' + i + '" style="float:right;background:none;border:none;color:var(--accent);cursor:pointer;font-size:0.5rem;">x</button>' +
                '</div>';
            });
            draftListEl.innerHTML = html;
            draftListEl.querySelectorAll('.admin-draft-item').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    if (e.target.classList.contains('admin-draft-del')) return;
                    var idx = parseInt(el.getAttribute('data-draft'));
                    loadIntoForm(JSON.parse(localStorage.getItem('blog-drafts') || '[]')[idx]);
                    setStatus('已加载草稿');
                });
            });
            draftListEl.querySelectorAll('.admin-draft-del').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.getAttribute('data-draft'));
                    var drafts = JSON.parse(localStorage.getItem('blog-drafts') || '[]');
                    drafts.splice(idx, 1);
                    localStorage.setItem('blog-drafts', JSON.stringify(drafts));
                    loadDrafts();
                });
            });
        }

        function editPost(post) { currentId = post.id; loadIntoForm(post); }

        function loadIntoForm(p) {
            editId.value = p.id || '';
            editTitle.value = p.title || '';
            editDate.value = p.date || todayStr();
            editTags.value = (p.tags || []).join(', ');
            editSummary.value = p.summary || '';
            // Set Quill content (HTML)
            quill.root.innerHTML = p.content || '';
            currentId = p.id || null;
            updatePreview();
        }

        function todayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
        }

        // ================================================================
        // Buttons
        // ================================================================
        document.getElementById('btn-reload').addEventListener('click', function() { setStatus('重新加载中...'); loadPosts(); });

        document.getElementById('btn-new').addEventListener('click', function() {
            currentId = null;
            editId.value = ''; editTitle.value = ''; editDate.value = todayStr();
            editTags.value = ''; editSummary.value = '';
            quill.root.innerHTML = '';
            updatePreview();
            postListEl.querySelectorAll('.admin-post-item').forEach(function(e) { e.classList.remove('active'); });
        });

        document.getElementById('btn-draft').addEventListener('click', function() {
            var post = getFormData();
            if (!post.title && !post.content) { setStatus('草稿为空，未保存'); return; }
            var drafts = [];
            try { drafts = JSON.parse(localStorage.getItem('blog-drafts') || '[]'); } catch(e) {}
            var found = false;
            for (var i = 0; i < drafts.length; i++) { if (drafts[i].id === post.id) { drafts[i] = post; found = true; break; } }
            if (!found) drafts.push(post);
            localStorage.setItem('blog-drafts', JSON.stringify(drafts));
            loadDrafts(); setStatus('草稿已保存');
        });

        document.getElementById('btn-cancel').addEventListener('click', function() { document.getElementById('btn-new').click(); });

        document.getElementById('btn-publish').addEventListener('click', async function() {
            var post = getFormData();
            if (!post.title) { setStatus('错误: 标题不能为空'); return; }
            if (!post.id) { post.id = post.date + '-' + post.title.replace(/[^a-zA-Z0-9一-鿿]/g, '-').substring(0, 40); }
            var found = false;
            for (var i = 0; i < posts.length; i++) { if (posts[i].id === post.id) { posts[i] = post; found = true; break; } }
            if (!found) posts.push(post);
            posts.sort(function(a, b) { return b.date.localeCompare(a.date); });
            await doPublish('更新博客: ' + post.title);
            var drafts = [];
            try { drafts = JSON.parse(localStorage.getItem('blog-drafts') || '[]'); } catch(e) {}
            drafts = drafts.filter(function(d) { return d.id !== post.id; });
            localStorage.setItem('blog-drafts', JSON.stringify(drafts));
            loadDrafts();
        });

        async function doPublish(commitMsg) {
            setStatus('正在发布...');
            try {
                var content = JSON.stringify(posts, null, 2);
                var body = { message: commitMsg, content: encodeUTF8(content) };
                if (postsSha) body.sha = postsSha;
                var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + POSTS_PATH;
                var resp = await fetch(url, {
                    method: 'PUT', headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) {
                    var errData = await resp.json();
                    var msg = errData.message || 'HTTP ' + resp.status;
                    if (resp.status === 401) msg = 'Token 无效或已过期，请重置 Token';
                    throw new Error(msg);
                }
                postsSha = (await resp.json()).content.sha;
                renderPostList();
                setStatus('发布成功！GitHub Pages 将在 1 分钟内更新');
            } catch(e) { setStatus('发布失败: ' + e.message); }
        }

        // ================================================================
        // Live preview
        // ================================================================
        quill.on('text-change', updatePreview);
        editTitle.addEventListener('input', updatePreview);

        function updatePreview() {
            var html = quill.root.innerHTML || '';
            var title = editTitle.value || '(无标题)';
            previewEl.innerHTML = '<h2>' + esc(title) + '</h2>' + html;
        }

        // ================================================================
        // Helpers
        // ================================================================
        function getFormData() {
            var tags = editTags.value.split(',').map(function(t) { return t.trim(); }).filter(Boolean);
            return {
                id: editId.value || null,
                title: editTitle.value.trim(),
                date: editDate.value || todayStr(),
                tags: tags,
                summary: editSummary.value.trim(),
                content: quill.root.innerHTML
            };
        }

        function setStatus(msg) {
            statusEl.textContent = msg;
            if (msg.indexOf('成功') !== -1) statusEl.style.color = 'var(--accent-teal)';
            else if (msg.indexOf('失败') !== -1 || msg.indexOf('错误') !== -1) statusEl.style.color = 'var(--accent)';
            else statusEl.style.color = 'var(--dim)';
        }

        function encodeUTF8(str) {
            var bytes = new TextEncoder().encode(str);
            var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }

        function decodeUTF8(b64) {
            var bin = atob(b64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        function esc(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ================================================================
        // Delete post
        // ================================================================
        var deleteTarget = null;
        function showConfirm(title, onConfirm) {
            deleteTarget = { cb: onConfirm };
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-overlay').style.display = 'flex';
        }
        document.getElementById('confirm-cancel').addEventListener('click', function() { document.getElementById('confirm-overlay').style.display = 'none'; deleteTarget = null; });
        document.getElementById('confirm-ok').addEventListener('click', async function() {
            document.getElementById('confirm-overlay').style.display = 'none';
            if (deleteTarget) { await deleteTarget.cb(); deleteTarget = null; }
        });

        postListEl.addEventListener('contextmenu', function(e) {
            var el = e.target.closest('.admin-post-item');
            if (!el) return;
            e.preventDefault();
            var idx = parseInt(el.getAttribute('data-idx'));
            var post = posts[idx];
            showConfirm('确认删除 "' + post.title + '" ？', async function() {
                posts.splice(idx, 1);
                renderPostList();
                await doPublish('删除: ' + post.title);
            });
        });
    })();
    </script>

    <!-- Theme toggle -->
    <script>
    (function() {
        var html = document.documentElement, toggleBtn = document.getElementById('theme-toggle'), transTimer = null;
        function setTheme(mode) {
            document.body.classList.add('theme-transitioning');
            clearTimeout(transTimer);
            transTimer = setTimeout(function() { document.body.classList.remove('theme-transitioning'); }, 200);
            if (mode === 'light') { html.classList.add('light'); html.classList.remove('dark'); if (toggleBtn) toggleBtn.textContent = '[DARK]'; try { localStorage.setItem('theme', 'light'); } catch(e) {} }
            else { html.classList.remove('light'); html.classList.add('dark'); if (toggleBtn) toggleBtn.textContent = '[LIGHT]'; try { localStorage.setItem('theme', 'dark'); } catch(e) {} }
        }
        if (toggleBtn) { toggleBtn.addEventListener('click', function() { setTheme(html.classList.contains('light')?'dark':'light'); }); }
        var cur = html.classList.contains('light') ? 'light' : 'dark';
        if (toggleBtn) toggleBtn.textContent = cur === 'light' ? '[DARK]' : '[LIGHT]';
    })();
    </script>
</body>
